# syslog-ng drop-in for the OT zone (ics-lab-server).
# Forwards all OT syslog to the IT workstation on TCP/514.
#
# Deploy to: /etc/syslog-ng/conf.d/ics-lab.conf
# Replace <IT_WORKSTATION_IP> with the IT zone VM IP (default: 192.168.100.10)
#
# Reload with: systemctl restart syslog-ng

destination d_it_workstation {
    tcp("<IT_WORKSTATION_IP>" port(514));
};

log {
    source(s_src);
    destination(d_it_workstation);
};
