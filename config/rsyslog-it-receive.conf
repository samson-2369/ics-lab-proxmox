# rsyslog snippet for the IT zone (ics-workstation).
# Enables TCP syslog reception on port 514 so OT zone logs are received.
#
# Apply by uncommenting these two lines in /etc/rsyslog.conf:
#
#   module(load="imtcp")
#   input(type="imtcp" port="514")
#
# Then reload with: systemctl restart rsyslog
#
# Received OT logs appear in /var/log/syslog tagged with the OT hostname.
# Monitor live: tail -f /var/log/syslog | grep ics-lab-server

module(load="imtcp")
input(type="imtcp" port="514")
